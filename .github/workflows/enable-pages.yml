name: Enable GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/enable-pages.yml
  workflow_dispatch:

permissions:
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Serve docs/ from main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body='{"build_type":"legacy","source":{"branch":"main","path":"/docs"}}'
          code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d "${body}")
          echo "POST ${code}"
          cat /tmp/pages.json
          echo
          if [ "${code}" != "201" ] && [ "${code}" != "200" ]; then
            code=$(curl -sS -o /tmp/pages.json -w "%{http_code}" \
              -X PUT \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
              -d "${body}")
            echo "PUT ${code}"
            cat /tmp/pages.json
            echo
          fi
          case "${code}" in
            200|201) exit 0 ;;
            *) exit 1 ;;
          esac
